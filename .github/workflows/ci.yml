# CI: quality (+audit) → uji integrasi (Testcontainers) → build + smoke HTTP (auth & RBAC).
name: ci
on:
  push: { branches: [main] }
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1
  BRAND_ID: default

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc }
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm type-check
      - run: pnpm test # unit + sinkron menu FE↔seed + guard per page + gate kontras + aturan migrasi
      - run: pnpm audit --prod --audit-level high

  integration:
    runs-on: ubuntu-latest # Docker tersedia → Testcontainers (PG14)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc }
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:integration # migrasi + seed, auth, matriks RBAC, users, sample items, konkurensi

  build-smoke:
    needs: [quality]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14
        env: { POSTGRES_USER: wms, POSTGRES_PASSWORD: wms, POSTGRES_DB: wms }
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U wms" --health-interval 2s --health-retries 30
    env:
      DATABASE_URL: postgres://wms:wms@localhost:5432/wms
      JWT_SECRET: ci-only-jwt-secret-at-least-32-characters!!
      SESSION_SECRET: ci-only-session-secret-at-least-32-chars!!
      COOKIE_SECURE: 'false' # smoke memakai http://localhost
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc }
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: start web
        run: |
          pnpm db:migrate && pnpm db:seed
          (PORT=3000 node apps/web/.next/standalone/apps/web/server.js > web.log 2>&1 &)
          for i in $(seq 1 30); do curl -sf localhost:3000/api/ready && break; sleep 1; done
      - run: bash scripts/smoke.sh
      - if: failure()
        run: cat web.log
