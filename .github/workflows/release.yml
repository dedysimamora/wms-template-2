# CD: tag rilis `v*` → bangun image (web per brand + migrate) dan terbitkan ke GHCR.
# Deploy per server tetap manual (README §Deploy).
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        brand: [default] # tambah brand klien di sini (apps/web/brands/<klien>)
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: web (${{ matrix.brand }})
        uses: docker/build-push-action@v6
        with:
          context: .
          target: web
          build-args: BRAND_ID=${{ matrix.brand }}
          push: true
          tags: ghcr.io/${{ github.repository }}/web:${{ github.ref_name }}-${{ matrix.brand }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: migrate
        if: matrix.brand == 'default'
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrate
          push: true
          tags: ghcr.io/${{ github.repository }}/migrate:${{ github.ref_name }}
          cache-from: type=gha
